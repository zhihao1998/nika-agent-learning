[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nika-agent-learning"
version = "0.1.0"
description = "Harness evolution experiments using NIKA execution and scoring"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28,<0.29",
    "PyYAML>=6,<7",
    "jsonschema>=4,<5",
    "python-dotenv>=1,<2",
]

[project.scripts]
nika-learning = "nika_learning.meta_adapter:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nika_learning"]

[dependency-groups]
dev = [
    "matplotlib>=3.10,<4",
    "pytest>=8,<10",
    "ruff>=0.14,<0.15",
]
