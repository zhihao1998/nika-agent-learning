name: Checks
on: [push, pull_request]
jobs:
  controller:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --frozen
      - run: uv run pytest -q
      - run: uv run ruff check src meta_runtime meta_candidates scripts tests
      - run: uv run ruff format --check src meta_runtime meta_candidates scripts tests
